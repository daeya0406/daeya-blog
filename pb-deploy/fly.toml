app = "daeya-blog"

[env]
  POCKETBASE_ADMIN_EMAIL="admin@example.com"
  POCKETBASE_ADMIN_PASSWORD="yourpassword"

[[services]]
  internal_port = 8090
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443